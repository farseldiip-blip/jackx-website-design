name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants read access to repo metadata (needed to detect user vs. project sites)
# and write access to publish the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let the newer commit supersede the older.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Pages site type
        id: pages
        uses: actions/configure-pages@v5
        # configure-pages computes the correct base_path for both a user/org
        # site (`/`) and a project site (`/<repo>`) and exposes it as an output.
        # It is also what sets `base_url` (the absolute origin), which we reuse
        # for canonical URLs, the sitemap and robots.txt.

      - name: Build static export
        env:
          # Empty for a user site; "/<repo>" for a project site.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Absolute origin, e.g. https://jackx.github.io
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
